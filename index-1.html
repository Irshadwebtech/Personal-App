function challanForm(editId){var old=editId?S.c.find(function(x){return x.id===editId}):null,items=old&&old.items&&old.items.length?JSON.parse(JSON.stringify(old.items)):[{kind:old?'Purana challan (qism details add karein)':'',qty:1,rate:old?old.total:0}],img=old?old.img||'':'',d=document.createElement('div');
function line(z,i){return '<div class="card challan-line" data-line="'+i+'" style="padding:10px;margin:8px 0"><label>Atta ki qism</label><input class="ikind" placeholder="Fine, Chakki, Maida, etc." value="'+esc(z.kind)+'"><div class="g2"><div><label>Quantity</label><input class="iqty" type="number" min="0.01" step="0.01" inputmode="decimal" value="'+esc(z.qty)+'"></div><div><label>Rate per unit (Rs)</label><input class="irate" type="number" min="0.01" step="0.01" inputmode="decimal" value="'+esc(z.rate)+'"></div></div><div class="row"><span class="k">Line total</span><b class="line-total">'+rs2(lineAmt(z.qty,z.rate))+'</b></div>'+(items.length>1?'<button type="button" class="btn d remove-line">Remove item</button>':'')+'</div>'}
function redraw(){var list=d.querySelector('#items');list.innerHTML=items.map(line).join('');bindLines();calc()}
function bindLines(){[].forEach.call(d.querySelectorAll('.challan-line'),function(el,i){['.ikind','.iqty','.irate'].forEach(function(sel){el.querySelector(sel).oninput=function(){var row=el;items[i]={kind:row.querySelector('.ikind').value,qty:row.querySelector('.iqty').value,rate:row.querySelector('.irate').value};calc()}});var rm=el.querySelector('.remove-line');if(rm)rm.onclick=function(){items.splice(i,1);redraw()}})}
function calc(){var total=0;[].forEach.call(d.querySelectorAll('.challan-line'),function(el){var qv=+el.querySelector('.iqty').value||0,rv=+el.querySelector('.irate').value||0,sub=lineAmt(qv,rv);total+=sub;el.querySelector('.line-total').textContent=rs(sub)});d.querySelector('#ctotal').textContent=rs(total)}
d.innerHTML='<div class="mod"><div class="box"><h3 style="margin-top:0">'+(old?'✏️ Challan Edit':'🌾 Naya Atta Challan')+'</h3><label>Challan Date</label><input id="cdate" type="date" value="'+(old?esc(old.date):today())+'"><div class="row"><b>Atta items</b><span class="k">Har qism ka alag rate</span></div><div id="items"></div><button type="button" class="btn" id="additem">+ Add atta qism</button><div class="card"><div class="row"><b>Total Challan</b><b class="v" id="ctotal">Rs 0</b></div><label>Paid amount (Rs)</label><input id="cpaid" type="number" min="0" step="0.01" inputmode="decimal" value="'+(old?esc(old.paid||0):'0')+'"></div><label>Bill / Slip photo (optional)</label><input id="cfile" type="file" accept="image/*"><div id="cpreview">'+(img?'<img class="th" src="'+img+'">':'')+'</div><button class="pbtn" id="csave">Save Challan</button><button class="btn" id="ccancel" style="width:100%;margin-top:8px;text-align:center">Cancel</button></div></div>';
document.body.appendChild(d);redraw();d.querySelector('#additem').onclick=function(){items.push({kind:'',qty:1,rate:0});redraw()};d.querySelector('#ccancel').onclick=function(){d.remove()};d.firstChild.onclick=function(e){if(e.target===this)d.remove()};d.querySelector('#cfile').onchange=function(){var fl=this.files&&this.files[0];if(!fl)return;d.querySelector('#cpreview').textContent='Photo upload ho rahi hai...';comp(fl,function(u){if(u)img=u;d.querySelector('#cpreview').innerHTML=img?'<img class="th" src="'+img+'">':'Photo load nahi hui';})};d.querySelector('#csave').onclick=function(){var date=d.querySelector('#cdate').value,paid=+d.querySelector('#cpaid').value||0,clean=[];[].forEach.call(d.querySelectorAll('.challan-line'),function(el){clean.push({kind:el.querySelector('.ikind').value.trim(),qty:+el.querySelector('.iqty').value,rate:+el.querySelector('.irate').value})});if(!date){toast('Challan date select karain');return}if(!clean.length||clean.some(function(z){return !z.kind||!(z.qty>0)||!(z.rate>0)||!isFinite(z.qty*z.rate)})){toast('Har atta item ki qism, quantity aur rate sahi likhain');return}var total=Math.round(clean.reduce(function(a,z){return a+lineAmt(z.qty,z.rate)},0)*100)/100;if(!(total>0)||paid<0||paid>total){toast('Paid amount total se zyada nahi ho sakta');return}if(old){old.date=date;old.items=clean;old.total=total;old.paid=paid;old.img=img;old.updatedAt=stamp()}else S.c.push({id:id(),date:date,items:clean,total:total,paid:paid,img:img,createdAt:stamp(),payments:paid?[{id:id(),amt:paid,date:date,createdAt:stamp()}]:[]});save();d.remove();tab='c';show();toast(old?'Challan update ho gaya ✓':'Challan save ho gaya ✓')}};
